# Reverse proxy so the dashboard is reachable at http://flightdeck.localhost
# (Chrome/Firefox auto-resolve *.localhost -> 127.0.0.1, so no host DNS/mDNS
# entry is needed). Same-machine only; LAN devices cannot use .localhost.
server {
    listen 80 default_server;
    server_name flightdeck.localhost;

    # keep long-lived clients (the SSE /api/stream live feed) from timing out
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://token-audit:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events: the dashboard pushes live updates over
        # /api/stream. Buffering would hold events back / break the stream,
        # so disable it (dashboard traffic is low, no downside here).
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }
}

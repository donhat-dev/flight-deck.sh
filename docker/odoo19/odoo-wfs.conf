[options]
; The Workflow Studio port and its probe databases, apart from Flightdoo: a job or
; cron of theirs cannot hold Flightdoo's queue, and Flightdoo's cannot hold theirs.
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/flightdeck-addons,/mnt/vendor-addons,/mnt/wfs-addons
data_dir = /var/lib/odoo
db_host = pgcore-17
db_port = 5432
db_name = wfs_port,fd_probe_style
dbfilter = ^(wfs_port|fd_probe_style)$
admin_passwd = flightdeck
workers = 0
limit_time_cpu = 600
limit_time_real = 1200
log_level = info
server_wide_modules = base,web,queue_job
dev_mode = xml

[queue_job]
channels = root:1

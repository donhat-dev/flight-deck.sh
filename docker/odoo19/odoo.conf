[options]
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/flightdeck-addons,/mnt/vendor-addons,/mnt/wfs-addons
data_dir = /var/lib/odoo
db_host = pgcore-17
db_port = 5432
dbfilter = ^flightdeck_odoo$
# The cron thread and the job runner serve every database on the server unless
# db_name names them; dbfilter only limits HTTP. With root:1 below, a job stuck in
# another database held the one slot and stopped Flightdoo's jobs (2026-09-29).
db_name = flightdeck_odoo
admin_passwd = flightdeck
workers = 0
limit_time_cpu = 600
limit_time_real = 1200
log_level = info
# The job runner is a thread this module patches into the server, so it only
# exists if the module is loaded before any database is.
server_wide_modules = base,web,queue_job
# Reload QWeb from file on each request, so a template change needs no restart.
dev_mode = xml

[queue_job]
# One at a time. The scan jobs read the same files and the same session rows,
# and there is nothing here that a second worker would finish sooner.
channels = root:1

[options]
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/flightdeck-addons
data_dir = /var/lib/odoo
db_host = pgcore-17
db_port = 5432
dbfilter = ^flightdeck_odoo$
admin_passwd = flightdeck
workers = 0
limit_time_cpu = 600
limit_time_real = 1200
log_level = info
# Reload QWeb from file on each request, so a template change needs no restart.
dev_mode = xml
